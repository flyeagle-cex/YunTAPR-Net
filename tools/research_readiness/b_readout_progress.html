<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>极端降水 · B 推理进度</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #19323d;
      --muted: #48616e;
      --paper: #edf4f6;
      --surface: #fbfdfe;
      --line: #bdcfd7;
      --rain: #136785;
      --warn: #933b26;
      font: 16px/1.55 "Microsoft YaHei UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 32px, 960px); margin: clamp(24px, 8vh, 90px) auto 40px; }
    header, footer, .progress-caption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; }
    h1 { font-size: clamp(24px, 4vw, 36px); margin: 0; }
    header p { color: var(--muted); margin: 4px 0 0; }
    button { font: inherit; font-weight: 600; min-height: 44px; padding: 8px 16px; background: var(--surface); color: var(--rain); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
    button:hover { background: var(--paper); }
    button:focus-visible { outline: 3px solid var(--rain); outline-offset: 4px; }
    section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: clamp(18px, 4vw, 36px); margin-top: 24px; }
    h2 { font-size: 16px; margin: 0; color: var(--rain); }
    h2[data-state="stopped"], h2[data-state="verify"] { color: var(--warn); }
    .count { font: 700 clamp(46px, 10vw, 94px)/1.15 Consolas, monospace; letter-spacing: -.07em; margin: 10px 0 16px; }
    .count small { font-size: .43em; color: var(--muted); letter-spacing: -.02em; }
    progress { display: block; width: 100%; height: 12px; accent-color: var(--rain); }
    .progress-caption { margin-top: 10px; color: var(--muted); }
    dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 24px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
    dt { color: var(--muted); }
    dd { margin: 4px 0 0; font-weight: 700; font-variant-numeric: tabular-nums; }
    footer { margin-top: 18px; color: var(--muted); }
    @media (max-width: 530px) { dl { grid-template-columns: 1fr; gap: 10px; } }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>极端降水 · B 推理进度</h1>
      <p>B7 / Seed 2029 / REAL COSINE9 E9 · 2024 开发集</p>
    </div>
    <button type="button" id="refresh">刷新进度</button>
  </header>
  <section aria-label="推理进度">
    <h2 id="status" role="status">正在连接本机进度服务…</h2>
    <p class="count"><span id="count">—</span><small> / <span id="total">121</span> 批</small></p>
    <progress id="bar" aria-label="已确认写完的批次"></progress>
    <div class="progress-caption"><span>已确认写完的批次</span><strong id="percent">—</strong></div>
    <dl>
      <div><dt>启动时间（北京）</dt><dd id="start">—</dd></div>
      <div><dt>运行耗时</dt><dd id="elapsed">—</dd></div>
      <div><dt>待确认批次</dt><dd id="remaining">—</dd></div>
    </dl>
    <p id="note">当前分片在下一批开始写入或最终收据确认后计入。</p>
  </section>
  <footer><span id="updated">等待读取快照</span><span>本机只读 · 每 10 秒刷新</span></footer>
</main>
<script>
  const $ = id => document.getElementById(id);
  const clock = new Intl.DateTimeFormat("zh-CN", {
    timeStyle: "medium", timeZone: "Asia/Shanghai", hourCycle: "h23"
  });
  const labels = {
    pending: "等待启动", running: "推理进行中", closing: "已写入最后一批，正在汇总",
    complete: "本次推理已完成", stopped: "本次运行已停止", verify: "运行状态待核对"
  };
  const notes = {
    complete: "全部批次与完成收据一致。科学结论待核对。",
    stopped: "保留停止前的分片，运行状态以停止收据为准。",
    closing: "等待最终收据，最后一批尚未计入。"
  };
  function render(s) {
    const progress = Math.max(0, Math.min(s.total, s.confirmed));
    $("status").textContent = labels[s.state];
    $("status").dataset.state = s.state;
    $("count").textContent = progress;
    $("total").textContent = s.total;
    $("bar").max = s.total;
    $("bar").value = progress;
    $("percent").textContent = (100 * progress / s.total).toFixed(1) + "%";
    $("start").textContent = s.started_at ? clock.format(new Date(s.started_at)) : "—";
    const t = s.elapsed_seconds;
    $("elapsed").textContent = [Math.floor(t / 3600), Math.floor(t / 60) % 60, t % 60]
      .map(n => String(n).padStart(2, "0")).join(":");
    $("remaining").textContent = (s.total - progress) + " 批";
    $("note").textContent = notes[s.state] || "当前分片在下一批开始写入或最终收据确认后计入。";
    $("updated").textContent = "最近更新 " + clock.format(new Date(s.as_of)) + "（北京）";
  }
  let refreshing = false;
  async function refresh() {
    if (refreshing) return;
    refreshing = true;
    try {
      const response = await fetch("/api/progress", {cache: "no-store"});
      if (!response.ok) throw new Error("Snapshot unavailable");
      render(await response.json());
    } catch {
      $("updated").textContent = "暂时无法读取本机状态，保留上次进度。";
    } finally {
      refreshing = false;
    }
  }
  $("refresh").addEventListener("click", refresh);
  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 10000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
