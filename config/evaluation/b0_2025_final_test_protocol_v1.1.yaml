metric_definitions:
  rainy: float32 R > float32(0.1), before float64 promotion
  occurrence: float64 focal BCE alpha=0.5 gamma=2, S_occ / N_valid
  quantile: mean over 32 tau of log1p conditional rainy pinball, S_qr / N_valid
  global_core_loss: (S_occ+S_qr)/N_valid over full eligible population; never batch-average
  Brier: sum((p-rainy)^2)/N_valid
  AUROC: exact equal-score groups with half credit for ties; no binned approximation
  Average_Precision: NON_INTERPOLATED_END_OF_EXACT_EQUAL_SCORE_GROUP
  conditional_mean_pinball: S_qr/N_rain
  tau: (i-0.5)/32, i=1..32
  coverage: R <= physical conditional quantile, valid rainy cells only
  coverage_error: per-tau signed coverage-minus-tau, per-tau absolute error, mean
    absolute error; inherited low/middle/high groups
  undefined: null with reason; no-rain conditional metrics null; single-class AUROC
    null; empty bins null
  numerical_check_population: all output cells; statistical population is IMERG_valid
    AND frozen Yunnan mask
  strict_crossing: adjacent q_i <= q_(i-1) in either log or physical domain
  support: qlog_1 <= log1p(0.1) or physical q_1 <= 0.1
  numerical_violation_action: STOP_NO_REPAIR
  POD_FAR_CSI: THRESHOLD_NOT_FROZEN
  probability_threshold: null
  no_post_2025_metric_selection: true
