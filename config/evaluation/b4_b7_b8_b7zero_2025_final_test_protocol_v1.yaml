population:
  year: 2025
  months: [3, 4, 5, 6, 7, 8, 9]
  analysis_hours_utc: [0, 6, 12, 18]
  window_minutes: 30
  window_convention: LEFT_CLOSED_RIGHT_OPEN
  window_span_utc:
    start: '2025-03-01T00:00:00+00:00'
    end: '2025-10-01T00:00:00+00:00'
  sample_id: window_start
  sample_id_format: UTC ISO-8601 with explicit +00:00
  clock_convention: 'sample_id = window_start = analysis_time - 30min; analysis on 00/06/12/18 UTC'
  expected_scenes: 856
  scenes_rule: 'every 2025-03-01T00:00Z..2025-10-01T00:00Z analysis on the four-hour grid, one scene each'
  satellite:
    product: HIMAWARI_9_AHI_L1B
    channels: [B08, B09, B10, B11, B13, B15, B16]
    nominal_offsets_before_analysis_minutes: [60, 50, 40, 30, 20, 10]
    slots: 6
    layout_default: '{YYYYMM}/{DD}/NC_H09_{YYYYMMDD}_{HHMM}_R21_FLDK.06001_06001.nc'
    layout_note: >-
      Confirmed by frozen 2023/2024 evidence (H09/R21), e.g.
      docs/b0_pretraining_closure/runs/run_20260930T095416Z/real_normalized_forward_smoke.json:149
      records H:\葵花202303_202510\202303\01\NC_H09_20230301_0020_R21_FLDK.06001_06001.nc.
      The implementation keeps the pattern configurable; an H08/R02 alternative
      is never an implicit fallback.
  gfs:
    initialization_lag_hours: 6
    lead_hours: 6
    init_hours_utc: [0, 6, 12, 18]
    main_and_thermo: REQUIRED_PAIR
    layout_main_default: '{YYYY}/{YYYYMMDD}/gfs_0p25_{YYYYMMDDHH}_f006.nc'
    layout_thermo_default: '{YYYY}/{YYYYMMDD}/gfs_thermo_0p25_{YYYYMMDDHH}_f006.nc'
    layout_basis: >-
      Confirmed from frozen 2023/2024 raw-layout probes (stage0 discovery
      evidence: F:\云南极端降水数据\raw\GFS\2023\20230101\gfs_0p25_2023010100_f006.nc
      and matching GFS_thermo sibling).  No 2025 directory was listed, stat-ed
      or opened to prepare this draft.
  imerg:
    product: GPM_3IMERGHH_07
    version: V07
    run_type: Final
    units: 'mm hr-1'
    day_file_layout: '{YYYY}/imerg_{YYYYMMDD}.nc'
    target_window: 'one 30-minute window ending at analysis_time'
    half_hour_index: 'window_start.hour * 2 + window_start.minute // 30'
  target_grid: SP04 100x100
  yunnan_supervision_region_pixels: 3430
  common_modality_rule: 'all six satellite frames + GFS main + GFS thermo + IMERG day file + frozen SP04 grid and Yunnan mask'
  october: HARD_REJECT_BEFORE_SOURCE_IO
  carry_in_exception: '2025-03-01T00:00Z analysis legitimately uses 2025-02-28 satellite frames and the 2025-02-28T18:00Z GFS initialization'

