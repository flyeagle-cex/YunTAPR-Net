# ---------------------------------------------------------------------------
# Metrics: exactly the B0 v1.1 primary definitions.
# ---------------------------------------------------------------------------
primary_metrics:
  - global_core_loss
  - occurrence_loss
  - quantile_loss
  - Brier
  - AUROC
  - Average_Precision
  - conditional_mean_pinball
  - per_tau_pinball
  - 32_tau_conditional_coverage
  - coverage_error
  - crossing_count
  - nonfinite_count
  - support_violation_count
metric_definitions:
  rainy: 'float32 R > float32(0.1), evaluated before any float64 conversion'
  occurrence: 'float64 focal BCE alpha=0.5 gamma=2; S_occ / N_valid'
  quantile: 'mean of 32 log1p conditional rainy pinball losses; S_qr / N_valid'
  global_core: '(S_occ + S_qr) / N_valid; never batch-averaged'
  brier: 'sum((p - rainy)^2) / N_valid'
  auroc: 'exact equal-score groups, tie half credit'
  average_precision: 'NON_INTERPOLATED_END_OF_EXACT_EQUAL_SCORE_GROUP'
  conditional_mean_pinball: 'S_qr / N_rain'
  tau: '(i - 0.5) / 32, i = 1..32'
  coverage: 'R <= physical conditional quantile; valid rainy cells only'
  coverage_error: 'signed (coverage - tau), absolute, and mean absolute over 32 taus'
  q32_signed_bias: 'coverage[tau=31/32] - 31.5/32'
  q32_absolute_error: 'abs(q32_signed_bias)'
  crossing: 'adjacent q_i <= q_(i-1) in log or physical domain'
  support: 'qlog_1 <= log1p(0.1) or physical q_1 <= 0.1'
  nonfinite: 'any nonfinite occurrence probability or quantile'
  stop_rule: 'STOP_NO_REPAIR on support or crossing violation'
  undefined: 'null with explicit reason'
  thresholds: 'POD / FAR / CSI THRESHOLD_NOT_FROZEN'
estimand: 'paired descriptive differences; no hypothesis test, confidence interval or significance claim is frozen'
comparisons:
  primary: {label: B7_REAL_MINUS_B7_ZERO_DOTE, left: B7, right: B7_ZERO_DOTE, co_primary: [Brier, conditional_mean_pinball]}
  secondary:
    - {label: B8_MINUS_B7_REAL, left: B8, right: B7}
    - {label: B7_REAL_MINUS_B4, left: B7, right: B4}
    - {label: B8_MINUS_B4, left: B8, right: B4}
  aggregation: 'per-seed paired difference, then equal-weight mean over 3 seeds; null seeds counted, not imputed'
  secondary_metrics: [AUROC, Average_Precision, 32_tau_conditional_coverage, q32_signed_bias, q32_absolute_error, mean_absolute_coverage_error]

# ---------------------------------------------------------------------------
# Inference contract.
# ---------------------------------------------------------------------------
inference:
  mode: FINAL_ONLY_NO_SELECTION
  read_only: true
  model_eval: true
  torch_inference_mode: true
  physical_batch: 1
  scenes_per_batch: 1
  drop_last: false
  num_workers: 0
  precision: 'BF16 cuda autocast; FP32 parameters; float64 quantiles, coverage and metrics'
  seed: 2026
  torch_threads: 2
  normalization: PHASE_B_FINALFIT
  staging: 'BOUNDED_ENGLISH_OWN_UUID_COPY_SIZE_SHA_REQUIRED'
  output: 'one new append-only output directory under the authorized output_root'
  failure_policy: 'write failure.json STOP_REQUIRED, preserve partials, exit non-zero; no retry, no selection'
prohibitions:
  - training
  - backward
  - optimizer
  - parameter_update
  - normalization_refit
  - calibration
  - threshold_tuning
  - checkpoint_selection
  - architecture_or_loss_change
  - learning_rate_change
  - 2025_october
  - true_2025_inference_in_this_phase

# ---------------------------------------------------------------------------
# Three-stage authorization; each stage is a separate researcher act.
# ---------------------------------------------------------------------------
execution_gates:
  - stage: INVENTORY_MEASUREMENT_RESEARCHER_AUTHORITY
    gate: inventory_measurement_authorization_json
    allowed: >-
      stat/list-only visibility of the expected 2025 payload paths (six satellite
      slots, GFS main/thermo, IMERG day files) to determine presence, exact unique
      file set and exact byte totals; no file content may be opened, hashed or
      decoded and no checkpoint may be loaded
  - stage: CATALOGUE_ONLY_RESEARCHER_AUTHORITY
    gate: catalogue_authorization_json_plus_inventory_plus_qc_payload_grant
    allowed: >-
      caller-supplied inventory inspection plus, only when the researcher
      catalogue authorization also carries CATALOGUE_QC_PAYLOAD_AUTHORIZED:
      read-only size check and streaming SHA-256 of exactly the files listed in
      the frozen inventory measurement, plus one-pass IMERG metadata QC on those
      files; no checkpoint load, no model build, no forward pass and no
      evaluation metric
  - stage: OUTCOME_FREE_CATALOGUE_QC_AND_FREEZE
    gate: catalogue_freeze_record
    allowed: 'catalogue/population/freeze artefacts only'
  - stage: SEPARATE_POST_FREEZE_FINAL_TEST_AUTHORITY
    gate: final_test_authorization_json
    allowed: 'checkpoint and frozen-input identity verification; dry-run plan'
  - stage: FINAL_READ_ONLY_INFERENCE
    gate: payload_authorization_json_plus_final_test_authorization_json
    allowed: 'one bounded final pass after the payload-phase QC hashing budget is frozen'
must_bind:
  - protocol
  - implementation
  - catalogue
  - population
  - catalogue_freeze_record
  - twelve_checkpoint_sha256
  - frozen_inputs
authorization_created_utc_rule: MUST_NOT_PRECEDE_REAL_CATALOGUE_FREEZE_COMPLETION
payload_access_rule: 'the payload authorization is a separate object from the catalogue and final-test authorizations'
artifact_names:
  candidate_catalogue: b4_b7_b8_2025_candidate_catalogue_v1.csv
  population_manifest: b4_b7_b8_2025_population_manifest_v1.json
  catalogue_freeze_record: b4_b7_b8_2025_catalogue_freeze_record_v1.json
  metrics_dir: metrics
  comparisons: comparisons.json
  run_manifest: run_manifest.json
  final_status: final_status.json
  failure: failure.json
catalogue_schema:
  columns: 42
  source: src/yuntapr/experimental/research_readiness/final_test_2025_catalogue.py::COLUMNS
  unknown_columns: REJECT
  rows_per_scene: 1

