motivation: >
  2026-11-27 阶段汇报的 2024 Development 表混合了 3-seed 与 1-seed 配置。
  按常规确认性研究实践，用于确认性主张的每个配置至少需要 3 个独立训练 seed。
  本包补齐 B2（S2 单时次基线）、B5（S4 高程单通道）、B6（S4 六通道静态地形）
  在 seed 2030 与 2031 上缺失的种子，使每个阶段配置达到 3 seed 最低线。
  已存在的 E0 对照行（B7/B8/ZERO 三 seed 检查点）与 COSINE9 行
  （SCHEDULE9 seed2029 + V4 REAL seed2030/2031）不需要新训练，
  只做既有无指标复算重排；本包不重复训练这些模型。

