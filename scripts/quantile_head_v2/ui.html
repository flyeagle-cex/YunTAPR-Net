<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef1f4"><title>Quantile Head v2 · 工程验证</title>
<style>:root{--paper:#eef1f4;--surface:#fafbfd;--ink:#213346;--muted:#46576b;--line:#c5ced8;--signal:#195b83;--danger:#8a302c;--s1:8px;--s2:16px;--s3:32px;--r:4px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1020px;margin:48px auto;padding:0 var(--s3)}h1{font-size:32px;line-height:1.2;margin:0 0 var(--s2)}h2{font-size:22px;margin:var(--s3) 0 var(--s2)}p{max-width:75ch;margin:var(--s1) 0}#status{font-size:26px;font-weight:700;color:var(--signal);overflow-wrap:anywhere}.meta{color:var(--muted)}section{margin-top:var(--s3);padding:var(--s2) 0;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line)}th,td{text-align:left;vertical-align:top;padding:12px var(--s2);border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{width:34%;font-weight:400;color:var(--muted)}td,.mono{font-family:Consolas,"Microsoft YaHei",monospace;font-variant-numeric:tabular-nums}a{color:var(--signal);padding:4px 0;display:inline-block;margin-right:var(--s2)}a:focus-visible{outline:2px solid var(--signal);outline-offset:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 Consolas,"Microsoft YaHei",monospace;margin:0;color:var(--danger)}footer{margin-top:var(--s3);padding-bottom:var(--s3);color:var(--muted)}@media(max-width:620px){main{margin:24px auto;padding:0 var(--s2)}h1{font-size:26px}th{width:40%}td,th{padding:10px var(--s1)}}
</style><main><h1>Quantile Head v2</h1><p>分位数输出头 v2：科学冻结候选与工程验证</p><p class="meta">本页只读。自动刷新测试进度；正式训练和 2025 原始数据访问均未授权。</p>
<section aria-live="polite"><div id="status">连接监控服务…</div><p id="updated" class="meta"></p></section>
<table aria-label="实时工程验证进度"><tbody><tr><th>运行标识</th><td id="run">—</td></tr><tr><th>当前阶段</th><td id="phase">—</td></tr><tr><th>本阶段已完成测试</th><td id="count">—</td></tr><tr><th>当前测试</th><td id="test">—</td></tr><tr><th>进程存活</th><td id="alive">—</td></tr><tr><th>失败 / 错误 / 跳过</th><td id="errors">—</td></tr><tr><th>新增正式 optimizer steps（优化更新）</th><td id="steps">—</td></tr><tr><th>2025 原始数据访问</th><td id="raw">—</td></tr></tbody></table>
<section><h2>完成核验</h2><p id="result">测试结束后显示实际 suite counts（测试套件数量）与历史文件一致性。</p><p id="commit" class="mono"></p><p><a href="/report" target="_blank" rel="noopener">科学决策包</a><a href="/data-decision" target="_blank" rel="noopener">数据复用决策包</a></p><pre id="error"></pre></section>
<footer>训练路径解耦：核心损失只使用对数域结果。数学与浮点严格性分开报告；科学接受、种子、数据及训练协议仍等待研究者批准。</footer></main>
<script>const put=(id,value)=>document.getElementById(id).textContent=value??'—';async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error('服务响应 '+r.status);const s=await r.json();put('status',s.status+' · '+({'RUNNING':'运行中','READY':'等待验证','PASS':'测试已通过','FAIL':'已停止，需检查','COMPLETE':'证据已完成'}[s.status]||'状态已记录'));put('updated','记录时间：'+new Date(s.utc).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+'（北京时间）');put('run',s.run);put('phase',s.phase);put('count',s.tests_completed);put('test',s.current_test);put('alive',s.process_alive?'是':'否');put('errors',[s.failures??0,s.errors??0,s.skipped??0].join(' / '));put('steps',s.formal_optimizer_steps_added);put('raw',s.raw_2025_access);put('error',s.error||'');if(s.test_gate){const g=s.test_gate;put('result','v2 测试 '+g.v2_tests.run+' 项；v1 回归 '+g.regression_tests.run+' 项；合计 '+g.tests+' 项。历史文件字节一致：'+g.historical_immutability.all_byte_identical+'。');}if(s.publication)put('commit','GitHub main：'+(s.publication.commit_sha||s.publication.status));}catch(e){put('status','连接中断，等待服务恢复');put('error',e.message)}finally{setTimeout(refresh,3000)}}refresh();</script></html>
